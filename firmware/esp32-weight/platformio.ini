[platformio]
; Keep the existing switch build as the default, even after adding HX711 targets.
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
upload_speed = 115200
platform = espressif32@6.9.0
board = sauli-esp32s3-n16r8
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
lib_deps = bblanchon/ArduinoJson@^7.4.2

; Opt-in bench/production HX711 build. Switch build above remains unchanged.
[env:esp32-s3-n16r8-hx711]
extends = env:esp32-s3-n16r8
build_flags =
    ${env:esp32-s3-n16r8.build_flags}
    -DSAULI_SENSOR_MODE_HX711=1
    -DSAULI_HX711_ENABLED_MASK=0x0FFF

; TEST ONLY: explicitly enables USB serial TARE and CALIBRATE commands.
; The HX711 production build does not enable the USB calibration interface.
[env:esp32-s3-n16r8-hx711-bench]
extends = env:esp32-s3-n16r8-hx711
build_flags =
    ${env:esp32-s3-n16r8-hx711.build_flags}
    -DSAULI_HX711_BENCH_CALIBRATION=1
